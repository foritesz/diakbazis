<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.4.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <title>Weboldal Kínézet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #f8f8f8;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: relative;
        }
        .logo {
            margin-left: 20px;
        }
        .search-bar {
            flex-grow: 1;
            text-align: center;
            position: relative;
        }
        .search-bar input {
            width: 50%;
            padding: 8px;
        }

        .search-icon {
            display: none;
        }
        .dropdown-menu {
            display: flex;
            justify-content: center;
            background-color: #eee;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .dropdown-menu select {
            margin: 0 10px;
            padding: 5px;
        }
        .dropdown {
            display: none;
            flex-direction: column;
            background-color: #eee;
            width: 100%;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .dropdown select {
            width: calc(100% - 20px);
            margin: 5px 10px;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            margin-top: 10px;
        }
        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: #333;
            margin: 4px 0;
        }
        .content {
            display: flex;
            width: 1000px;
            margin: 20px auto;
        }
        .filter {
            width: 25%;
            padding: 10px;
            border-right: 1px solid #ddd;
        }
        .filter h3 {
            cursor: pointer;
            margin: 0;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
        }
        .subcategory {
            padding-left: 20px;
        }
        .products {
            width: 75%;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .product-card {
            display: flex;
            width: calc(100% - 20px);
            border: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }
        .image-container img {
            max-width: 150px;
            height: auto;
            margin-right: 10px;
        }
        .zoom-image {
            width: 100%;
            height: 100%;
        }
        .zoom-window {
            display: none;
            position: absolute;
            top: 1px;
            left: 200px;
            width: 500px;
            height: 500px;
            border: 2px solid #000;
            overflow: hidden;
            z-index: 900;
            background: #fff;
        }
        .zoom-window .zoomed-image {
            width: 100%;
            height: 100%;
            transform: scale(1.5);
        }
        .image-container:hover + .zoom-window {
            display: block;
        }
        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .footer {
            background-color: #f8f8f8;
            padding: 10px;
            text-align: center;
            border-top: 1px solid #ddd;
            margin-top: 20px;
        }
        @media (max-width: 1024px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .hamburger {
                display: flex;
            }
            .search-icon {
                position: absolute;
                right: 10px;
                top: 100px;
                cursor: pointer;
                display: flex;
            }
            .search-bar {
                flex-grow: 1;
                text-align: center;
                position: relative;
                display: none;
            }
            .search-bar.active {
                display: flex; /* Show when active */
            }
            .search-bar input {
                margin-top: 20px;
                width: 700px;
            }
            .dropdown-menu {
                display: none;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .dropdown-menu.active {
                display: flex;
            }
            .content {
                width: 100%;
                flex-direction: column;
            }
            .filter {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            .products {
                width: 100%;
            }
            .product-card {
                width: calc(100% - 20px);
            }
            .subcategory {
                display: none;
            }
            .filter h3.active + .subcategory {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <h1>Logó</h1>
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="search-icon" onclick="toggleSearchBar()">
            <i class="bi bi-search"></i>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Keresés...">
        </div>
    </div>

    <div class="dropdown-menu">
        <select><option>Papír-Írószer</option></select>
        <select><option>Kreatív</option></select>
        <select><option>Játék</option></select>
        <select><option>Ajándék</option></select>
        <select><option>Könyv</option></select>
        <select><option>Táska-Pénztárca</option></select>
        <select><option>Cipő</option></select>
        <select><option>Háztartási cikkek</option></select>
        <select><option>Szezonális</option></select>
        <select><option>Óra</option></select>
        <select><option>Szolgáltatás</option></select>
    </div>

    <div class="dropdown-menu dropdown">
        <select><option>Papír-Írószer</option></select>
        <select><option>Kreatív</option></select>
        <select><option>Játék</option></select>
        <select><option>Ajándék</option></select>
        <select><option>Könyv</option></select>
        <select><option>Táska-Pénztárca</option></select>
        <select><option>Cipő</option></select>
        <select><option>Háztartási cikkek</option></select>
        <select><option>Szezonális</option></select>
        <select><option>Óra</option></select>
        <select><option>Szolgáltatás</option></select>
    </div>

    <div class="content">
        <div class="filter">
            <h3 onclick="toggleCategory('cat1')">Kategória 1</h3>
            <div class="subcategory" id="cat1">
                <label><input type="checkbox"> Alkategória 1.1</label><br>
                <label><input type="checkbox"> Alkategória 1.2</label><br>
                <label><input type="checkbox"> Alkategória 1.3</label><br>
            </div>
            <h3 onclick="toggleCategory('cat2')">Kategória 2</h3>
            <div class="subcategory" id="cat2">
                <label><input type="checkbox"> Alkategória 2.1</label><br>
                <label><input type="checkbox"> Alkategória 2.2</label><br>
                <label><input type="checkbox"> Alkategória 2.3</label><br>
            </div>
        </div>
        <div class="products">
            <div class="product-card">
                <div class="image-container">
                    <img src="https://via.placeholder.com/150" alt="Product Image" class="zoom-image">
                </div>
                <div class="zoom-window" id="zoomWindow">
                    <img src="https://via.placeholder.com/150" alt="Zoomed Image" class="zoomed-image">
                </div>
                <div class="product-details">
                    <h3>Termék neve</h3>
                    <p>Termék leírása...</p>
                    <p>Ár: 1000 Ft</p>
                </div>
            </div>
            
            <div class="product-card">
                <div class="image-container">
                    <img src="https://via.placeholder.com/150" alt="Product Image" class="zoom-image">
                </div>
                <div class="zoom-window" id="zoomWindow">
                    <img src="https://via.placeholder.com/150" alt="Zoomed Image" class="zoomed-image">
                </div>
                <div class="product-details">
                    <h3>Termék neve</h3>
                    <p>Termék leírása...</p>
                    <p>Ár: 1000 Ft</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>&copy; 2024 Webshop. Minden jog fenntartva.</p>
    </div>

    <script>
        function toggleCategory(id) {
            var element = document.getElementById(id);
            if (element.style.display === "none" || element.style.display === "") {
                element.style.display = "block";
            } else {
                element.style.display = "none";
            }
        }

        function toggleMenu() {
            var dropdown = document.querySelector('.dropdown-menu.dropdown');
            if (dropdown.classList.contains('active')) {
                dropdown.classList.remove('active');
            } else {
                dropdown.classList.add('active');
            }
        }

        function toggleSearchBar() {
            var searchBar = document.querySelector('.search-bar');
            if (searchBar.classList.contains('active')) {
                searchBar.classList.remove('active');
            } else {
                searchBar.classList.add('active');
            }
        }

        window.addEventListener('load', function() {
            if (window.innerWidth <= 1024) {
                var subcategories = document.querySelectorAll('.subcategory');
                subcategories.forEach(function(subcategory) {
                    subcategory.style.display = "none";
                });
            }
        });
    </script>

</body>
</html>
